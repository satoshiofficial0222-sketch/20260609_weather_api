<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天気検索</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
      background: linear-gradient(135deg, #74b9ff, #0984e3);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      background: white;
      border-radius: 16px;
      padding: 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      color: #2d3436;
      margin-bottom: 28px;
    }

    .search-area {
      display: flex;
      gap: 8px;
      margin-bottom: 28px;
    }

    input[type="text"] {
      flex: 1;
      padding: 12px 16px;
      border: 2px solid #dfe6e9;
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: #0984e3;
    }

    button {
      padding: 12px 20px;
      background: #0984e3;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    button:hover {
      background: #0773c5;
    }

    button:disabled {
      background: #b2bec3;
      cursor: not-allowed;
    }

    .error {
      background: #fff0f0;
      color: #d63031;
      border: 1px solid #fab1b1;
      border-radius: 10px;
      padding: 14px 16px;
      font-size: 0.95rem;
      text-align: center;
    }

    .weather-card {
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      border-radius: 12px;
      padding: 28px;
      text-align: center;
    }

    .city-name {
      font-size: 1.4rem;
      font-weight: bold;
      color: #2d3436;
      margin-bottom: 4px;
    }

    .weather-icon {
      width: 80px;
      height: 80px;
      margin: 8px auto;
    }

    .weather-description {
      font-size: 1.1rem;
      color: #636e72;
      margin-bottom: 20px;
      text-transform: capitalize;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-box {
      background: white;
      border-radius: 10px;
      padding: 14px 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
    }

    .stat-label {
      font-size: 0.75rem;
      color: #b2bec3;
      margin-bottom: 6px;
      letter-spacing: 0.05em;
    }

    .stat-value {
      font-size: 1.3rem;
      font-weight: bold;
      color: #2d3436;
    }

    .stat-unit {
      font-size: 0.8rem;
      color: #636e72;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌤 天気検索</h1>

  <div class="search-area">
    <input type="text" id="cityInput" placeholder="都市名を入力（例: Tokyo）" />
    <button id="searchBtn" onclick="fetchWeather()">検索</button>
  </div>

  <div id="errorMsg" class="error hidden"></div>

  <div id="weatherCard" class="weather-card hidden">
    <div class="city-name" id="cityName"></div>
    <img class="weather-icon" id="weatherIcon" src="" alt="天気アイコン" />
    <div class="weather-description" id="weatherDesc"></div>
    <div class="stats">
      <div class="stat-box">
        <div class="stat-label">気温</div>
        <div class="stat-value" id="temp">--</div>
        <div class="stat-unit">°C</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">体感温度</div>
        <div class="stat-value" id="feelsLike">--</div>
        <div class="stat-unit">°C</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">湿度</div>
        <div class="stat-value" id="humidity">--</div>
        <div class="stat-unit">%</div>
      </div>
    </div>
  </div>
</div>

<script>
  // ここにAPIキーを設定してください
  const API_KEY = 'eccfefb76eb73a3ef3b0c3378a3cfd36';

  const WEATHER_TRANSLATIONS = {
    'clear sky': '晴れ',
    'few clouds': '少し曇り',
    'scattered clouds': '散在する雲',
    'broken clouds': '曇り',
    'overcast clouds': '厚い雲',
    'light rain': '小雨',
    'moderate rain': '雨',
    'heavy intensity rain': '大雨',
    'very heavy rain': '激しい雨',
    'extreme rain': '非常に激しい雨',
    'freezing rain': '氷雨',
    'light snow': '小雪',
    'snow': '雪',
    'heavy snow': '大雪',
    'sleet': 'みぞれ',
    'thunderstorm': '雷雨',
    'mist': '霧',
    'fog': '濃霧',
    'haze': 'もや',
    'dust': '砂埃',
    'sand': '砂嵐',
    'tornado': '竜巻',
  };

  function translateDescription(desc) {
    const lower = desc.toLowerCase();
    return WEATHER_TRANSLATIONS[lower] || desc;
  }

  document.getElementById('cityInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') fetchWeather();
  });

  async function fetchWeather() {
    const city = document.getElementById('cityInput').value.trim();
    const btn = document.getElementById('searchBtn');
    const errorEl = document.getElementById('errorMsg');
    const cardEl = document.getElementById('weatherCard');

    errorEl.classList.add('hidden');
    cardEl.classList.add('hidden');

    if (!city) {
      showError('都市名を入力してください。');
      return;
    }

    btn.disabled = true;
    btn.textContent = '取得中...';

    try {
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(city)}&appid=${API_KEY}&units=metric&lang=ja`;
      const res = await fetch(url);
      const data = await res.json();

      if (!res.ok) {
        if (data.cod === '404') {
          showError('都市が見つかりませんでした。都市名を英語で入力してください（例: Tokyo, Osaka）。');
        } else if (data.cod === 401) {
          showError('APIキーが無効です。コード先頭の API_KEY を確認してください。');
        } else {
          showError(`エラーが発生しました: ${data.message || '不明なエラー'}`);
        }
        return;
      }

      document.getElementById('cityName').textContent = `${data.name}（${data.sys.country}）`;
      document.getElementById('weatherIcon').src = `https://openweathermap.org/img/wn/${data.weather[0].icon}@2x.png`;
      document.getElementById('weatherDesc').textContent = translateDescription(data.weather[0].description);
      document.getElementById('temp').textContent = Math.round(data.main.temp);
      document.getElementById('feelsLike').textContent = Math.round(data.main.feels_like);
      document.getElementById('humidity').textContent = data.main.humidity;

      cardEl.classList.remove('hidden');
    } catch (err) {
      showError('通信エラーが発生しました。ネットワーク接続を確認してください。');
    } finally {
      btn.disabled = false;
      btn.textContent = '検索';
    }
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.remove('hidden');
  }
</script>

</body>
</html>
